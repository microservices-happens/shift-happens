global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # RabbitMQ Prometheus plugin (enabled through /etc/rabbitmq/enabled_plugins).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Container CPU/RAM/network; useful while stressing or scaling replicas.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # KEDA operator metrics, exposed through a NodePort service in the local cluster.
  - job_name: keda
    static_configs:
      - targets: ["host.docker.internal:32073"]

  # Kubernetes Deployment replica counts for the autoscaling dashboard. KEDA gives
  # the queue length; kube-state-metrics gives the number of ready pods.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["host.docker.internal:32080"]

  - job_name: identity-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["identity-service:8080"]
  - job_name: workforce-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["workforce-service:8080"]
  - job_name: scheduling-command
    metrics_path: /prometheus
    static_configs:
      - targets: ["scheduling-command:8080"]
  - job_name: scheduling-query
    metrics_path: /prometheus
    dns_sd_configs:
      - names: ["scheduling-query"]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: leave-command
    metrics_path: /prometheus
    static_configs:
      - targets: ["leave-command:8080"]
  - job_name: leave-query
    metrics_path: /prometheus
    static_configs:
      - targets: ["leave-query:8080"]
  - job_name: notification-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["notification-service:8080"]
  - job_name: audit-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["audit-service:8080"]
  - job_name: ai-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["ai-service:8080"]
