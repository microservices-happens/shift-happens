openapi: 3.1.0
info:
  title: Scheduling Service
  version: 1.0.0
  description: 'Shifts, required job roles, assignments, shift approvals and shift swaps. Deployed as two roles from one codebase:
    the command role (Postgres, transactional outbox) serves writes and returns 202 Accepted with the resulting resource;
    the query role (Mongo read model, eventually consistent) serves reads. Deletes are soft (tombstone) and publish *.deleted.v1.
    This file covers the command role only: all reads are GraphQL on the query role (contracts/graphql/scheduling.graphql,
    /api/graphql). Participates in the leave-approval saga (consumes leave.request.approval-started.v1).'
servers:
- url: /
  description: Service root. Exposed by the gateway under /api (e.g. /api/v1/shifts).
