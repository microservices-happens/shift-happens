components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Shift:
      type: object
      required:
      - departmentId
      - workLocationId
      - shiftName
      - startDatetime
      - endDatetime
      - shiftStatus
      properties:
        shiftId:
          type: integer
          readOnly: true
        departmentId:
          type: integer
        workLocationId:
          type: integer
        shiftName:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        shiftStatus:
          type: string
    ShiftRequiredJobRole:
      type: object
      required:
      - shiftId
      - jobRoleId
      - requiredEmployeeCount
      properties:
        shiftRequiredJobRoleId:
          type: integer
          readOnly: true
        shiftId:
          type: integer
        jobRoleId:
          type: integer
        requiredEmployeeCount:
          type: integer
          minimum: 1
    ShiftAssignment:
      type: object
      required:
      - shiftId
      - employeeId
      - assignmentStatus
