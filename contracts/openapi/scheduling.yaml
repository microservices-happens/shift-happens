components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated per user action. A repeated request with the same key returns the stored first response
        and causes no second side effect (kept 24 h). Same key with a different body returns 409.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Shift:
      type: object
      required:
      - departmentId
      - workLocationId
      - shiftName
      - startDatetime
      - endDatetime
      - shiftStatus
      properties:
        shiftId:
          type: integer
          readOnly: true
        departmentId:
          type: integer
        workLocationId:
          type: integer
        shiftName:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        shiftStatus:
          type: string
    ShiftRequiredJobRole:
      type: object
      required:
      - shiftId
      - jobRoleId
      - requiredEmployeeCount
      properties:
        shiftRequiredJobRoleId:
          type: integer
          readOnly: true
        shiftId:
          type: integer
        jobRoleId:
          type: integer
        requiredEmployeeCount:
          type: integer
          minimum: 1
    ShiftAssignment:
      type: object
      required:
      - shiftId
      - employeeId
      - assignmentStatus
      properties:
        shiftAssignmentId:
          type: integer
          readOnly: true
        shiftId:
          type: integer
        employeeId:
          type: integer
        assignmentStatus:
          type: string
        assignedDatetime:
          type:
          - string
          - 'null'
          format: date-time
        checkInDatetime:
          type:
          - string
          - 'null'
          format: date-time
        checkOutDatetime:
          type:
          - string
          - 'null'
          format: date-time
    ShiftApproval:
      type: object
      required:
      - shiftAssignmentId
      - approverEmployeeId
      - decision
      properties:
        shiftApprovalId:
          type: integer
          readOnly: true
        shiftAssignmentId:
          type: integer
        approverEmployeeId:
          type: integer
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        approvalComment:
          type:
          - string
          - 'null'
        decisionDatetime:
          type:
          - string
          - 'null'
          format: date-time
    ShiftSwap:
      type: object
      required:
      - originalShiftAssignmentId
      - employeeFromId
      - employeeToId
      properties:
        shiftSwapId:
          type: integer
          readOnly: true
        originalShiftAssignmentId:
          type: integer
        employeeFromId:
          type: integer
        employeeToId:
          type: integer
        swapStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          readOnly: true
        requestDatetime:
          type: string
          format: date-time
          readOnly: true
        reason:
          type:
          - string
          - 'null'
    ShiftSwapApproval:
      type: object
      required:
      - shiftSwapId
      - approverEmployeeId
      - decision
      properties:
        shiftSwapApprovalId:
          type: integer
          readOnly: true
        shiftSwapId:
          type: integer
        approverEmployeeId:
          type: integer
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        shiftSwapComment:
          type:
          - string
          - 'null'
        decisionDatetime:
          type:
          - string
          - 'null'
          format: date-time
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
