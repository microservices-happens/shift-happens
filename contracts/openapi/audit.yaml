        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
        aggregateId:
          type: integer
        correlationId:
          type: string
        receivedAt:
          type: string
          format: date-time
        envelope:
          type: object
          description: The original event envelope, stored unchanged.
  responses:
