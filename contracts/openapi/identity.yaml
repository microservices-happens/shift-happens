# Generated from the monolith DTOs; edit freely, this file is now the contract.
# See contracts/README.md for conventions.
openapi: 3.1.0
info:
  title: Identity Service
  version: 1.0.0
  description: Local login and third-party login (Google, GitHub via OAuth 2.0/OpenID Connect); issues the Shift Happens JWT.
    Consumes workforce.employee.* to keep one account per employee (email, role, active flag).
servers:
- url: /
  description: Service root. Exposed by the gateway under /api (e.g. /api/v1/shifts).
security:
- bearerAuth: []
tags:
- name: auth
- name: ops
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in and receive a JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/oidc/{provider}/authorize:
    get:
      tags:
      - auth
      summary: Start third-party login (OAuth 2.0 authorization code + PKCE)
      operationId: oidcAuthorize
      security: []
      description: 'Redirects the browser to the provider. Supported providers: google, github.'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      responses:
        '302':
          description: Redirect to the provider's consent page
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/oidc/{provider}/callback:
    get:
      tags:
      - auth
      summary: Provider redirect target
      operationId: oidcCallback
      security: []
      description: 'Exchanges the code, verifies the provider''s ID token (or GitHub user API), matches the verified email
        to an active account and redirects to FRONTEND_LOGIN_CALLBACK_URL#token=<Shift Happens JWT>. Unknown or inactive emails
        are refused: accounts are only created from workforce events.'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: 'Redirect to the frontend with the JWT in the URL fragment, or with #error=...'
  /v1/auth/accounts/{employeeId}/password:
    put:
      tags:
      - auth
      summary: Set or reset an employee's password
      description: 'Roles: Administrator, or the employee themself. The account itself is created from workforce.employee.created.v1,
        so passwords never pass through workforce-service.'
      operationId: setPassword
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /.well-known/jwks.json:
    get:
      tags:
      - auth
      summary: Public keys for verifying JWTs (internal, called by every service)
      operationId: jwks
      security: []
      responses:
        '200':
          description: Key set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
  /health:
    get:
      tags:
      - ops
      summary: Liveness/readiness probe used by the gateway and Compose
      operationId: health
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - UP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated per user action. A repeated request with the same key returns the stored first response
        and causes no second side effect (kept 24 h). Same key with a different body returns 409.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - employeeId
      - email
      - roleName
      properties:
        token:
          type: string
        employeeId:
          type: integer
        employeeNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        roleName:
          type: string
          enum:
          - Administrator
          - Manager
          - Employee
      description: Same shape as the monolith's LoginResponse so the frontend is unchanged.
    SetPasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
          minLength: 8
    Jwks:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: object
      description: RFC 7517 JSON Web Key Set.
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
