# Generated from the monolith DTOs; edit freely, this file is now the contract.
# See contracts/README.md for conventions.
openapi: 3.1.0
info:
  title: Notification Service
  version: 1.0.0
  description: Consumes events from queue notification.events (see asyncapi.yaml), stores in-app notifications and publishes
    notification.email.requested.v1 for email-function. The frontend polls GET /notifications.
servers:
- url: /
  description: Service root. Exposed by the gateway under /api (e.g. /api/v1/shifts).
security:
- bearerAuth: []
tags:
- name: notifications
- name: ops
paths:
  /v1/notifications:
    get:
      tags:
      - notifications
      summary: Notifications for the caller (employeeId from the JWT)
      operationId: myNotifications
      parameters:
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/notifications/{id}:
    patch:
      tags:
      - notifications
      summary: Mark as read
      operationId: markRead
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags:
      - ops
      summary: Liveness/readiness probe used by the gateway and Compose
      operationId: health
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - UP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated per user action. A repeated request with the same key returns the stored first response
        and causes no second side effect (kept 24 h). Same key with a different body returns 409.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Notification:
      type: object
      required:
      - notificationId
      - employeeId
      - title
      - createdAt
      - read
      properties:
        notificationId:
          type: integer
        employeeId:
          type: integer
        title:
          type: string
        message:
          type: string
        sourceEventType:
          type: string
          description: eventType that produced it, e.g. scheduling.swap.approved.v1
        sourceEventId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationUpdate:
      type: object
      required:
      - read
      properties:
        read:
          type: boolean
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
