components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Employee:
      type: object
      required:
      - employeeNumber
      - userRole
      - firstName
      - lastName
      - email
      - employmentStatus
      properties:
        employeeId:
          type: integer
          readOnly: true
        employeeNumber:
          type: string
        userRole:
          type: string
          enum:
          - Administrator
          - Manager
          - Employee
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type:
          - string
          - 'null'
        hireDate:
          type:
          - string
          - 'null'
          format: date
        employmentStatus:
          type: string
        primaryWorkLocationId:
          type:
          - integer
          - 'null'
      description: 'No password field: passwords are set via identity-service PUT /auth/accounts/{employeeId}/password.'
    EmployeeContract:
      type: object
      required:
      - employeeId
      - departmentId
      - contractType
      - startDate
      properties:
        contractId:
          type: integer
          readOnly: true
        employeeId:
          type: integer
        departmentId:
          type: integer
        contractType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
        weeklyHours:
          type:
          - integer
          - 'null'
        isActive:
          type: boolean
      description: salaryAmount is stored but never exposed.
    EmployeeJobRole:
      type: object
      required:
      - employeeId
      - jobRoleId
      - assignedDate
      properties:
        employeeJobRoleId:
          type: integer
          readOnly: true
        employeeId:
          type: integer
        jobRoleId:
          type: integer
        assignedDate:
          type: string
          format: date
        expiryDate:
          type:
          - string
          - 'null'
          format: date
        proficiencyLevel:
          type:
          - string
          - 'null'
    Department:
      type: object
      required:
      - departmentName
      properties:
        departmentId:
          type: integer
          readOnly: true
        departmentName:
          type: string
        isActive:
          type: boolean
    JobRole:
      type: object
      required:
      - roleName
      properties:
        jobRoleId:
          type: integer
          readOnly: true
        roleName:
          type: string
        jobRoleDescription:
          type:
          - string
          - 'null'
        isCertificationRequired:
          type: boolean
    WorkLocation:
      type: object
      required:
      - locationName
      - city
      - country
      - timezone
      properties:
        workLocationId:
          type: integer
          readOnly: true
        locationName:
          type: string
        addressLine1:
          type:
          - string
          - 'null'
        addressLine2:
          type:
          - string
          - 'null'
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        isActive:
          type: boolean
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
