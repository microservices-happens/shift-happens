info:
  title: Leave Service
  version: 1.0.0
  description: 'Leave types, requests, approvals and the immutable leave ledger. Deployed as two roles from one codebase:
    the command role (Postgres, transactional outbox) serves writes and returns 202 Accepted with the resulting resource;
    the query role (Mongo read model, eventually consistent) serves reads. Deletes are soft (tombstone) and publish *.deleted.v1.
    The gateway sends GET to the query role and other methods to the command role. leave-command orchestrates the leave-approval
    saga.'
