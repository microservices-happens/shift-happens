components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 JWT issued by identity-service. Verify with JWT_JWKS_URL. Claims: sub, employeeId, role, iss, iat,
        exp.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated on every outgoing call and copied into events.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    LeaveType:
      type: object
      required:
      - leaveTypeName
      properties:
        leaveTypeId:
          type: integer
          readOnly: true
        leaveTypeName:
          type: string
        leaveTypeDescription:
          type:
          - string
          - 'null'
        requiresApproval:
          type: boolean
        isPaidLeave:
          type: boolean
    LeaveRequest:
      type: object
      required:
      - employeeId
      - leaveTypeId
      - startDate
      - endDate
      properties:
        leaveRequestId:
          type: integer
          readOnly: true
        employeeId:
          type: integer
        leaveTypeId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        requestStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CANCELLED
          readOnly: true
        reason:
          type:
          - string
          - 'null'
        requestedDatetime:
          type: string
          format: date-time
          readOnly: true
    LeaveApproval:
      type: object
      required:
      - leaveRequestId
      - approverEmployeeId
      - decision
      properties:
        leaveApprovalId:
          type: integer
          readOnly: true
        leaveRequestId:
          type: integer
        approverEmployeeId:
          type: integer
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        leaveComment:
          type:
          - string
          - 'null'
        decisionDatetime:
          type:
          - string
          - 'null'
          format: date-time
    LeaveLedgerEntry:
      type: object
      required:
      - employeeId
      - leaveTypeId
      - changeAmountDays
      - transactionType
      properties:
        leaveLedgerId:
          type: integer
          readOnly: true
        employeeId:
          type: integer
        leaveTypeId:
          type: integer
        changeAmountDays:
          type: number
        transactionType:
          type: string
        referenceEntityType:
          type:
          - string
          - 'null'
        referenceEntityId:
          type:
          - integer
          - 'null'
        transactionDatetime:
          type: string
          format: date-time
          readOnly: true
      description: Immutable. Corrections are new entries with the opposite amount.
    EmployeeLeaveOverview:
      type: object
      required:
      - employeeId
      - leaveRequestId
      properties:
        employeeId:
          type: integer
        employeeName:
          type: string
        leaveRequestId:
          type: integer
        leaveTypeName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        requestStatus:
          type: string
        balanceDays:
          type: number
      description: Read-model document built by leave-query from leave.* and workforce.employee.* events.
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business rule violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
