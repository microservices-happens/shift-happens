  messages:
    workforceEmployeeCreatedV1:
      name: workforce.employee.created.v1
      title: workforce.employee.created.v1
      summary: Employee created
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        allOf:
        - $ref: ./events/envelope.schema.json
