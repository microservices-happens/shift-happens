# SonarQube Cloud analysis for the whole monorepo (one project, see docs/ci-demo.md, P1.5).
# The organisation and project key are NOT stored here: the `sonar` job in .github/workflows/ci.yml
# passes them from the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
sonar.sources=services,functions,frontend/src,tests
sonar.tests=services,functions,frontend/src,tests
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx,tests/**
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/generated/**,**/generated-sources/**,**/*.min.js
sonar.java.binaries=services/*/target/classes,functions/*/target/classes
sonar.sourceEncoding=UTF-8
# The old monolith (src/, root pom.xml) is not listed in sonar.sources, so it is never analysed.
