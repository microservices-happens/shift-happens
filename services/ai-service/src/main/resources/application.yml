spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai}
    username: ${DB_USER:ai}
    password: ${DB_PASSWORD:ai_dev}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shift}
    password: ${RABBITMQ_PASSWORD:shift_dev}
    virtual-host: ${RABBITMQ_VHOST:shift-happens}
app:
  events:
    exchange: ${EVENT_EXCHANGE:shift-happens.events}
    dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:shift-happens.dlx}
  rabbit:
    queue: ${RABBITMQ_QUEUE:ai.suggestions}
  llm:
    base-url: ${LLM_BASE_URL:http://localhost:11434}
    model: ${LLM_MODEL:llama3.2:1b}
    timeout: ${LLM_TIMEOUT:PT20S}
  security:
    # Names are fixed by contracts/README.md: every service validates the JWT itself against the JWKS of
    # identity-service (cached by Nimbus), plus the iss claim.
    issuer: ${JWT_ISSUER:shift-happens-identity}
    jwks-url: ${JWT_JWKS_URL:http://localhost:8080/.well-known/jwks.json}
server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# P1.6: every log line carries the correlation id that CorrelationIdFilter / the listeners put in the MDC.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
