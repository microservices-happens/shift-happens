# Query role: MongoDB read model + GraphQL, fed by events (P2.10/P2.11).
# No Postgres, no outbox, no JPA: the exclusions guarantee that command-only infrastructure can never
# start here, which is what keeps the CQRS split honest.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  data:
    mongodb:
      # Variable names are fixed by docker-compose.microservices.yml.
      uri: ${MONGO_URI:mongodb://${MONGO_USERNAME:scheduling}:${MONGO_PASSWORD:scheduling_read_dev}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:scheduling_read}?authSource=${MONGO_AUTH_DATABASE:admin}}
  graphql:
    path: ${GRAPHQL_PATH:/graphql}
    graphiql:
      # P8.3: GraphiQL is a development tool, so it is off unless the dev profile or this variable says
      # otherwise (APP_ROLE=query,dev).
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:false}

app:
  rabbit:
    # One durable queue per consumer, bound to scheduling.*, workforce.employee.* and
    # ai.replacement.suggested.v1.
    queue: ${RABBITMQ_QUEUE:scheduling.projection}
  projection:
    # Start with PROJECTION_REBUILD_ON_START=true to replay the logged events into empty collections.
    rebuild-on-start: ${PROJECTION_REBUILD_ON_START:false}
