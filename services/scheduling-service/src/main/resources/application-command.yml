# Command role: Postgres write model + transactional outbox; serves the REST writes of
# contracts/openapi/scheduling.yaml and (later) the leave-approval saga message.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduling}
    username: ${DB_USER:scheduling}
    password: ${DB_PASSWORD:scheduling_dev}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; validate catches entity/migration drift at startup.
      ddl-auto: validate
  flyway:
    enabled: true

app:
  rabbit:
    # One durable queue per consumer (contracts/README.md); P3.1 adds the saga reply key.
    queue: ${RABBITMQ_QUEUE:scheduling.command}
