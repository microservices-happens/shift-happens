spring:
  application:
    name: scheduling-service
  # One codebase, two deployments (CQRS). Compose/K8s set APP_ROLE=command|query,
  # which activates application-command.yml or application-query.yml.
  profiles:
    active: ${APP_ROLE:command}
  # Names are fixed by docker-compose.microservices.yml / contracts/README.md.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shift}
    password: ${RABBITMQ_PASSWORD:shift_dev}
    virtual-host: ${RABBITMQ_VHOST:shift-happens}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

app:
  events:
    # Routing key == eventType == <context>.<entity>.<event>.vN (contracts/README.md).
    exchange: ${EVENT_EXCHANGE:shift-happens.events}
    dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:shift-happens.dlx}
    producer: scheduling-service
  outbox:
    # How often the relay looks for unpublished events.
    relay-delay: ${OUTBOX_RELAY_DELAY:2000}

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
