spring:
  application:
    name: identity-service

  # Environment variables match docker-compose.microservices.yml / contracts/README.md.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shift}
    password: ${RABBITMQ_PASSWORD:shift_dev}
    virtual-host: ${RABBITMQ_VHOST:shift-happens}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

app:
  events:
    exchange: ${EVENT_EXCHANGE:shift-happens.events}
    dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:shift-happens.dlx}
  rabbit:
    # One durable queue per consumer (contracts/README.md).
    queue: ${RABBITMQ_QUEUE:identity.accounts}
  jwt:
    issuer: ${JWT_ISSUER:shift-happens-identity}
    ttl: ${JWT_TTL:PT24H}
    # PKCS#8 PEM. Empty = generate a key at startup (dev only: tokens die on restart).
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  password:
    # Required: startup fails if it is missing, so hashes are never made without the pepper.
    pepper: ${PASSWORD_PEPPER:}
  bootstrap-admin:
    # Both empty = off. Gives the Administrator account with this email its first password, once.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Google/GitHub login (P2.3). A provider with an empty client id is disabled.
  oidc:
    # Browser-facing base of the callbacks; register <base>/{google|github}/callback with each provider.
    redirect-base-url: ${OIDC_REDIRECT_BASE_URL:https://localhost:8443/api/v1/auth/oidc}
    # The frontend page that receives #token=<jwt> or #error=<code>.
    frontend-callback-url: ${FRONTEND_LOGIN_CALLBACK_URL:https://localhost:8443/login/callback}
    # How long a started login (state + PKCE verifier) can be finished.
    state-ttl: PT10M
    google:
      client-id: ${OIDC_GOOGLE_CLIENT_ID:}
      client-secret: ${OIDC_GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer: https://accounts.google.com
    github:
      client-id: ${OIDC_GITHUB_CLIENT_ID:}
      client-secret: ${OIDC_GITHUB_CLIENT_SECRET:}
      authorization-uri: https://github.com/login/oauth/authorize
      token-uri: https://github.com/login/oauth/access_token
      user-uri: https://api.github.com/user
      emails-uri: https://api.github.com/user/emails

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
