spring:
  application:
    name: audit-service
server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
