spring:
  application:
    name: leave-service
  # One codebase, two deployments (CQRS). Compose/K8s set APP_ROLE=command|query,
  # which activates application-command.yml or application-query.yml.
  profiles:
    active: ${APP_ROLE:command}
  # Names are fixed by docker-compose.microservices.yml / contracts/README.md.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shift}
    password: ${RABBITMQ_PASSWORD:shift_dev}
    virtual-host: ${RABBITMQ_VHOST:shift-happens}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

app:
  events:
    # Routing key == eventType == <context>.<entity>.<event>.vN (contracts/README.md).
    exchange: ${EVENT_EXCHANGE:shift-happens.events}
    dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:shift-happens.dlx}
    producer: leave-service
  outbox:
    # How often the relay looks for unpublished events.
    relay-delay: ${OUTBOX_RELAY_DELAY:2000}
  security:
    # Every service validates the JWT itself (contracts/README.md).
    issuer: ${JWT_ISSUER:shift-happens-identity}
    jwks-url: ${JWT_JWKS_URL:http://localhost:8080/.well-known/jwks.json}

# P1.6: every log line carries the correlation id that CorrelationIdFilter / the listeners put in the MDC.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Swagger UI renders the hand-written contract (copied from contracts/openapi at build time).
springdoc:
  swagger-ui:
    url: /openapi/leave.yaml
    disable-swagger-default-url: true
