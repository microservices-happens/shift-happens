# Command role: Postgres write model + transactional outbox; handles REST writes and saga messages.
spring:
  autoconfigure:
    # The read model's MongoDB belongs to the query role; the command role must never start a Mongo client.
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leave}
    username: ${DB_USER:leave}
    password: ${DB_PASSWORD:leave_dev}
    hikari:
      # Bounds every lock wait (row and advisory locks) so a stuck lock cannot starve the pool; keep it well
      # below hikari's connection-timeout (30 s). Flyway shares this datasource, so a blocked migration fails.
      connection-init-sql: "SET lock_timeout = '${DB_LOCK_TIMEOUT:5s}'"
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; validate catches entity/migration drift at startup.
      ddl-auto: validate
  flyway:
    enabled: true

app:
  rabbit:
    # Durable consumer queue declared by LeaveCommandTopology (plus <queue>.dlq on the DLX).
    queue: ${RABBITMQ_QUEUE:leave.command}
  saga:
    # How long Scheduling may take to answer leave.request.approval-started.v1 (ISO-8601 duration) before the
    # approval is compensated; the same variable as docker-compose.microservices.yml and the K8s manifests.
    timeout: ${SAGA_TIMEOUT:PT5M}
    # How often (ms) overdue sagas are looked for.
    poll-delay: ${SAGA_TIMEOUT_POLL_DELAY:15000}
