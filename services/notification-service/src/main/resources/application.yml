spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification_dev}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shift}
    password: ${RABBITMQ_PASSWORD:shift_dev}
    virtual-host: ${RABBITMQ_VHOST:shift-happens}
  flyway:
    enabled: true

app:
  events:
    exchange: ${EVENT_EXCHANGE:shift-happens.events}
    dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:shift-happens.dlx}
    producer: notification-service
  rabbit:
    queue: ${RABBITMQ_QUEUE:notification.events}
  outbox:
    # How often the relay looks for unpublished email requests.
    relay-delay: ${OUTBOX_RELAY_DELAY:2000}
  security:
    issuer: ${JWT_ISSUER:shift-happens-identity}
    jwks-url: ${JWT_JWKS_URL:http://localhost:8080/.well-known/jwks.json}
  mail:
    # Local default is Mailpit (docker-compose.microservices.yml); email-function is the sender.
    from: ${SMTP_FROM:no-reply@shift-happens.local}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

# P1.6: every log line carries the correlation id that CorrelationIdFilter / the listener put in the MDC.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

# /health is the shared contract for the gateway, Compose and Kubernetes probes.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Swagger UI renders the hand-written contract (copied from contracts/openapi at build time).
springdoc:
  swagger-ui:
    url: /openapi/notification.yaml
    disable-swagger-default-url: true
