apiVersion: v1
kind: PersistentVolume
metadata:
  name: identity-db-pv
  labels:
    app: identity-db
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/shift-happens/identity-db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-db-pvc
  labels:
    app: identity-db
spec:
  storageClassName: manual
  volumeName: identity-db-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
