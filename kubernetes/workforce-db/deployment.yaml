apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-db
  labels:
    app: workforce-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workforce-db
  template:
    metadata:
      labels:
        app: workforce-db
    spec:
      containers:
        - name: workforce-db
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "workforce"
            - name: POSTGRES_USER
              value: "workforce"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: WORKFORCE_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workforce-db-pvc
