apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        version: v1.0.0
    spec:
      # The image runs as non-root uid 10001. fsGroup gives the process group 10001, which owns the
      # mounted signing key (mode 0440), so the key is readable without making it world-readable.
      securityContext:
        fsGroup: 10001
      containers:
        - name: identity-service
          image: ghcr.io/microservices-happens/identity-service:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-env
          env:
            - name: OTEL_SERVICE_NAME
              value: "identity-service"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: RABBITMQ_PASSWORD
            - name: DB_HOST
              value: "identity-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "identity"
            - name: DB_USER
              value: "identity"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_QUEUE
              value: "identity.accounts"
            # Required: identity-service does not start without the pepper.
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: PASSWORD_PEPPER
            # RS256 signing key, mounted from the secret below, so tokens survive a pod restart.
            - name: JWT_PRIVATE_KEY_PATH
              value: "/etc/identity-service/jwt/private-key.pem"
            # First-admin bootstrap. Both empty = off (see services/identity-service/README.md).
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: BOOTSTRAP_ADMIN_EMAIL
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: BOOTSTRAP_ADMIN_PASSWORD
            - name: OIDC_REDIRECT_BASE_URL
              value: "https://localhost:8443/api/v1/auth/oidc"
            - name: OIDC_GOOGLE_CLIENT_ID
              value: ""
            - name: OIDC_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: OIDC_GOOGLE_CLIENT_SECRET
            - name: OIDC_GITHUB_CLIENT_ID
              value: ""
            - name: OIDC_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-service-secrets
                  key: OIDC_GITHUB_CLIENT_SECRET
            - name: FRONTEND_LOGIN_CALLBACK_URL
              value: "https://localhost:8443/login/callback"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 640Mi
          volumeMounts:
            - name: jwt-signing-key
              mountPath: /etc/identity-service/jwt
              readOnly: true
      volumes:
        - name: jwt-signing-key
          secret:
            secretName: identity-service-secrets
            defaultMode: 0440
            items:
              - key: jwt-private-key.pem
                path: private-key.pem
