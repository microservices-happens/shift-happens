apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-read-db
  labels:
    app: scheduling-read-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduling-read-db
  template:
    metadata:
      labels:
        app: scheduling-read-db
    spec:
      containers:
        - name: scheduling-read-db
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "scheduling"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: SCHEDULING_MONGO_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --host 127.0.0.1 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scheduling-read-db-pvc
