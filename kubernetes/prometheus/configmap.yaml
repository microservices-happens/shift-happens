apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector:9464]

      - job_name: business-metrics
        metrics_path: /prometheus
        static_configs:
          - targets: [ai-service:8080, leave-command:8080]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: shift_ai_suggestions_total|shift_leave_saga_timeouts_total
            action: keep
