apiVersion: apps/v1
kind: Deployment
metadata:
  name: leave-command
  labels:
    app: leave-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leave-command
  template:
    metadata:
      labels:
        app: leave-command
    spec:
      containers:
        - name: leave-command
          image: luke3520/leave-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-env
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: RABBITMQ_PASSWORD
            - name: APP_ROLE
              value: "command"
            - name: DB_HOST
              value: "leave-write-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "leave"
            - name: DB_USER
              value: "leave"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: LEAVE_DB_PASSWORD
            - name: RABBITMQ_QUEUE
              value: "leave.command"
            - name: SAGA_TIMEOUT
              value: "PT5M"
            - name: OUTBOX_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 640Mi
