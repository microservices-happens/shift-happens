apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: ghcr.io/microservices-happens/audit-service:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-env
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: RABBITMQ_PASSWORD
            - name: DB_HOST
              value: "audit-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "audit"
            - name: DB_USER
              value: "audit"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shift-happens-secrets
                  key: AUDIT_DB_PASSWORD
            - name: RABBITMQ_QUEUE
              value: "audit.events"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 640Mi
