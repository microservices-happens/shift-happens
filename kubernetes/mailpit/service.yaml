apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
  labels:
    app: mailpit
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: ui
      port: 8025
      targetPort: 8025
      nodePort: 30025
