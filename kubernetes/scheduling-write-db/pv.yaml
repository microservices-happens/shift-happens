apiVersion: v1
kind: PersistentVolume
metadata:
  name: scheduling-write-db-pv
  labels:
    app: scheduling-write-db
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/shift-happens/scheduling-write-db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduling-write-db-pvc
  labels:
    app: scheduling-write-db
spec:
  storageClassName: manual
  volumeName: scheduling-write-db-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
