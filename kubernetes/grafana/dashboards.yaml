apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  shift-happens-observability.json: |
    {
      "id": null,
      "uid": "shift-happens-observability",
      "title": "Shift Happens - Observability",
      "tags": ["shift-happens", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "15s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services reporting telemetry",
          "description": "Distinct Java service names currently reporting JVM metrics.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" },
          "targets": [{ "refId": "A", "expr": "count(count by (service_name) (jvm_memory_used_bytes))", "instant": true }]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "JVM CPU utilization by service",
          "description": "Recent CPU utilization reported by each Java process. This is process-level JVM data, not Kubernetes pod CPU usage.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "jvm_cpu_recent_utilization_ratio", "legendFormat": "{{service_name}}", "instant": false }]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM heap used by service",
          "description": "Heap currently used by each Java process. This is JVM heap, not total container memory.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "sum by (service_name) (jvm_memory_used_bytes{jvm_memory_type=\"heap\"})", "legendFormat": "{{service_name}}", "instant": false }]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP requests per second by service",
          "description": "Request rate calculated from server request-duration counts over five minutes.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))", "legendFormat": "{{service_name}}", "instant": false }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP p95 response time by service",
          "description": "95th percentile of HTTP server request duration, calculated from the OpenTelemetry histogram.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service_name}}", "instant": false }]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Database connections in use",
          "description": "Connections currently in use in instrumented JDBC pools. Services using other database clients may not appear here.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "sum by (service_name) (db_client_connections_usage{state=\"used\"})", "legendFormat": "{{service_name}}", "instant": false }]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Prometheus scrape target status",
          "description": "1 means Prometheus can scrape the target. Targets include Prometheus, the Collector and business metric endpoints.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "none" } },
          "targets": [{ "refId": "A", "expr": "up", "legendFormat": "{{job}}", "instant": false }]
        },
        {
          "id": 8,
          "type": "text",
          "title": "Dashboard scope",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 32 },
          "options": {
            "mode": "markdown",
            "content": "JVM metrics come from instrumented app workloads. For broker queue depth, dead-letter queues and KEDA demand, see the Compose Live System dashboard."
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Leave saga timeouts",
          "description": "Leave approval attempts compensated after the response deadline in the last 15 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(shift_leave_saga_timeouts_total[15m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "AI suggestions using fallback",
          "description": "Share of saved suggestions using the rule fallback over the last 15 minutes. Gaps indicate that no suggestion was saved in that window.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(shift_ai_suggestions_total{source=\"rule\"}[15m])) / (sum(rate(shift_ai_suggestions_total[15m])) > 0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          }
        }
      ]
    }
