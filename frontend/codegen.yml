# GraphQL Code Generator: typed documents for the scheduling read API.
#
# The schema is the contract itself (contracts/graphql/scheduling.graphql), so an operation that asks
# for a field the contract does not have fails generation. The output is committed, like the OpenAPI
# types, because the frontend image is built with ./frontend as Docker context and cannot see
# ../contracts.
#
#   npm run generate:graphql   regenerate after a contract or operation change
#   npm run check:graphql      fail if src/graphql/generated.ts is out of date
overwrite: true
schema: ../contracts/graphql/scheduling.graphql
documents: src/graphql/operations/*.graphql
generates:
  src/graphql/generated.ts:
    plugins:
      - add:
          content: '/* Generated by GraphQL Code Generator from contracts/graphql/scheduling.graphql. Do not edit; run `npm run generate:graphql`. */'
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
      enumsAsTypes: true
      strictScalars: true
      scalars:
        DateTime: string
        Date: string
