# Composite action: run Maven with retries so a transient Maven Central failure does not fail the
# pipeline.
#
# We hit this on windows-latest: "Could not transfer artifact ... from/to central
# (https://repo.maven.apache.org/maven2): status code: 403, reason phrase: Forbidden". The 403 comes
# from Central's CDN, not from the POM, and it is transient - many parallel jobs download the same
# artifacts from a shared runner IP.
#
# Attempt 1 uses the default Central host. When the failure looks like a transfer problem, the
# retries add `-U`, switch to the alternate Central hostname
# (.github/maven/settings-fallback.xml) and delete the *.lastUpdated markers that a failed transfer
# leaves behind, because Maven otherwise treats the artifact as "absent" until the update interval
# has elapsed.
#
# A failure that does NOT look like a network problem (a real compile or test failure) is reported
# immediately, so a broken build is never hidden behind a retry.
name: maven-build
description: Run Maven with retries, a forced update and a fallback Maven Central host.

inputs:
  directory:
    description: Directory that contains the pom.xml, relative to the repository root
    required: true
  goals:
    description: Maven goals and options, for example "package" or "verify -Dskip.unit.tests=true"
    required: false
    default: package

runs:
  using: composite
  steps:
    - name: Run Maven
      shell: bash
      env:
        MAVEN_DIRECTORY: ${{ inputs.directory }}
        MAVEN_GOALS: ${{ inputs.goals }}
      run: |
        workspace="${GITHUB_WORKSPACE//\\//}"
        pom="${workspace}/${MAVEN_DIRECTORY}/pom.xml"
        fallback_settings="${workspace}/.github/maven/settings-fallback.xml"
        local_repo="${HOME}/.m2/repository"
        attempts=3
        log="$(mktemp)"

        if [ ! -f "$pom" ]; then
          echo "::error title=pom.xml not found::${pom} does not exist"
          exit 1
        fi

        # Matches the transient transfer failures we retry, including the 403 from Central's CDN.
        transient='Could not transfer artifact|Could not find artifact|Could not resolve dependencies|status code: 403|status code: 429|status code: 5[0-9][0-9]|Connection reset|Read timed out|connect timed out|Temporary failure in name resolution'

        for attempt in $(seq 1 "$attempts"); do
          echo "::group::mvn -B ${MAVEN_GOALS} (attempt ${attempt}/${attempts})"
          options=""
          if [ "$attempt" -gt 1 ]; then
            options="-U -s ${fallback_settings}"
            find "$local_repo" -name '*.lastUpdated' -delete 2>/dev/null || true
            echo "::warning title=Maven retry::attempt ${attempt} forces an update and uses the fallback Maven Central host"
          fi

          # shellcheck disable=SC2086
          if mvn -B -f "$pom" --no-transfer-progress \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Daether.connector.http.retryHandler.count=3 \
              $options $MAVEN_GOALS 2>&1 | tee "$log"; then
            echo "::endgroup::"
            echo "Maven succeeded on attempt ${attempt}"
            exit 0
          fi
          echo "::endgroup::"

          if ! grep -Eq "$transient" "$log"; then
            echo "::error title=Maven failed::The failure is not a transient transfer error, so it is not retried. See the log above."
            exit 1
          fi
          if [ "$attempt" -lt "$attempts" ]; then
            echo "Transient transfer failure; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          fi
        done

        # Leave a clean cache behind: a failed transfer must not poison the next run.
        find "$local_repo" -name '*.lastUpdated' -delete 2>/dev/null || true
        echo "::error title=Maven failed::Maven did not succeed after ${attempts} attempts"
        exit 1
