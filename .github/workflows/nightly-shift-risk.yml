# Scheduled domain pipeline: the nightly shift-risk report.
#
# It answers the questions a shift planner asks every morning:
#   1. which planned shifts in the coming days are short of staff,
#   2. which of those start within 24 hours (the "locked" window, where the leave saga cannot release
#      anyone, so a replacement is needed today),
#   3. was anyone double-booked, and was approved leave actually released from the schedule?
#
# Data source today: the monolith schema and seed data (docker/init) loaded into a MySQL service
# container inside this job. When Scheduling and Leave expose their read models, the same script can
# query those instead - see tests/schedule-report/README.md.
#
# It demonstrates: a cron schedule, a service container, workflow_dispatch inputs, an artifact,
# $GITHUB_STEP_SUMMARY and an issue created through the API.
name: nightly-shift-risk

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC every night
  workflow_dispatch:
    inputs:
      horizon_days:
        description: How many days ahead to check
        required: false
        default: '7'
      create_issue:
        description: Open or update a GitHub issue when the report has findings
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: shift risk report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: shift_happens
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a MySQL client is available
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi
          mysql --version

      - name: Load schema, seed data and the deliberate demo findings
        env:
          MYSQL_PWD: rootpassword
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MySQL is up after $attempt attempt(s)"; break
            fi
            echo "waiting for MySQL ($attempt)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uroot < docker/init/01-schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot shift_happens < docker/init/02-seed-data.sql
          mysql -h 127.0.0.1 -P 3306 -uroot shift_happens < tests/schedule-report/seed-demo-issues.sql
          mysql -h 127.0.0.1 -P 3306 -uroot shift_happens -e "
            SELECT COUNT(*) AS employees FROM employee;
            SELECT COUNT(*) AS shifts FROM shift;
            SELECT COUNT(*) AS assignments FROM shift_assignment;"

      - name: Build the report
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: shift_happens
          HORIZON_DAYS: ${{ inputs.horizon_days || '7' }}
          REPORT_FILE: schedule-risk-report.md
        run: |
          chmod +x tests/schedule-report/run-report.sh
          tests/schedule-report/run-report.sh

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-risk-report
          path: schedule-risk-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update an issue when requested and findings exist
        if: inputs.create_issue == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --search "Nightly shift risk report in:title" --state open \
            --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file schedule-risk-report.md
          else
            gh issue create --title "Nightly shift risk report" --body-file schedule-risk-report.md
          fi
