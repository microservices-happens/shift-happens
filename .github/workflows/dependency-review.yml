# Blocks pull requests that introduce a dependency with a known high-severity vulnerability.
# Works together with Dependabot (.github/dependabot.yml) and CodeQL (codeql.yml).
name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
