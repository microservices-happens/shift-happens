# Per-service CI in three gates: unit tests -> integration tests -> container image.
#
# Path filters make sure a change only builds and tests the services it can affect. A change under
# contracts/ rebuilds every service because every service either implements or consumes a
# contract (contracts/README.md).
#
# A manual run (Actions -> services -> Run workflow) skips the path filter and runs the whole gate
# for the services you name, so the image build and scan can be demonstrated without a pull request.
name: services

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: '"all", "auto" (detect from the last commit) or a space-separated list of services'
        required: false
        default: all
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      # Pull requests and main pushes: only the services the change can affect.
      - id: filter
        if: inputs.services == '' || inputs.services == 'auto'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            identity-service: ['services/identity-service/**', 'contracts/**']
            workforce-service: ['services/workforce-service/**', 'contracts/**']
            scheduling-service: ['services/scheduling-service/**', 'contracts/**']
            leave-service: ['services/leave-service/**', 'contracts/**']
            ai-service: ['services/ai-service/**', 'contracts/**']
            notification-service: ['services/notification-service/**', 'contracts/**']
            audit-service: ['services/audit-service/**', 'contracts/**']
            email-function: ['functions/email-function/**', 'contracts/**']

      # Manual run: an explicit list, so a demo can build and scan any image on demand.
      # The JSON array is built with bash, so the step has no jq/python dependency.
      - id: requested
        if: inputs.services != '' && inputs.services != 'auto'
        run: |
          requested="${{ inputs.services }}"
          if [ "$requested" = "all" ]; then
            requested="identity-service workforce-service scheduling-service leave-service ai-service notification-service audit-service email-function"
          fi
          matrix="["
          separator=""
          for service in $requested; do
            matrix="${matrix}${separator}\"${service}\""
            separator=","
          done
          matrix="${matrix}]"
          echo "services=$matrix" >> "$GITHUB_OUTPUT"
          echo "Requested: $matrix"

      - id: plan
        run: |
          requested='${{ steps.requested.outputs.services }}'
          filtered='${{ steps.filter.outputs.changes }}'
          if [ -n "$requested" ]; then
            services="$requested"
          elif [ -n "$filtered" ]; then
            services="$filtered"
          else
            services='[]'
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Selected services: $services" >> "$GITHUB_STEP_SUMMARY"


  unit-tests:
    name: unit-tests (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Surefire: *Test / *Tests. Fast domain tests, no containers.
      - name: Unit tests
        uses: ./.github/actions/maven-build
        with:
          directory: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}
          goals: test
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    name: integration-tests (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Detect *IT tests
        shell: bash
        working-directory: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}
        run: |
          if [ -n "$(find src/test -name '*IT.java' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No integration tests::${{ matrix.service }} has no *IT.java yet. The job passes with zero tests; add API, messaging and database ITs as part of P6.2-P6.4."
          fi
      # Failsafe: *IT with Testcontainers (Docker is available on hosted runners).
      # -Dskip.unit.tests=true is wired to Surefire in each pom, so unit tests are not repeated.
      - name: Integration tests
        uses: ./.github/actions/maven-build
        with:
          directory: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}
          goals: verify -Dskip.unit.tests=true
      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-${{ matrix.service }}
          path: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: image (${{ matrix.service }})
    needs: [changes, unit-tests, integration-tests]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ contains(matrix.service, 'function') && 'functions' || 'services' }}/${{ matrix.service }}
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          hide-progress: true
          token-setup-trivy: ${{ github.token }}
          # Report-only while the images are still walking skeletons, so the demo shows the scan
          # running and its findings instead of failing on base-image CVEs. Set the repository
          # variable TRIVY_EXIT_CODE=1 (Settings -> Variables) to turn it into a blocking gate (P6.7).
          exit-code: ${{ vars.TRIVY_EXIT_CODE || '0' }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

  # Always runs, even when a path filter skipped the other jobs. This is the single required
  # status check on main (see docs/implementation-plan.md §3): a skipped job is fine, a failed or
  # cancelled one fails the gate.
  ci:
    name: ci
    needs: [changes, unit-tests, integration-tests, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a service gate failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Summary
        run: |
          echo "changed services: ${{ needs.changes.outputs.services }}"
          echo "unit: ${{ needs.unit-tests.result }}"
          echo "integration: ${{ needs.integration-tests.result }}"
          echo "images: ${{ needs.images.result }}"

