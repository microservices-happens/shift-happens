# Build, test and package every service that changed. One job per changed service (matrix),
# so a failing service fails the pipeline without blocking unrelated work.
name: services

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # A contract change rebuilds every service that implements or consumes it.
          filters: |
            identity-service: ['services/identity-service/**', 'contracts/**']
            workforce-service: ['services/workforce-service/**', 'contracts/**']
            scheduling-service: ['services/scheduling-service/**', 'contracts/**']
            leave-service: ['services/leave-service/**', 'contracts/**']
            ai-service: ['services/ai-service/**', 'contracts/**']
            notification-service: ['services/notification-service/**', 'contracts/**']
            audit-service: ['services/audit-service/**', 'contracts/**']
            email-function: ['functions/email-function/**', 'contracts/**']

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service == 'email-function' && 'functions' || 'services' }}/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit + integration tests (Testcontainers runs on the hosted runner's Docker).
      - name: Test
        run: mvn -B verify
      # TODO: SonarQube Cloud quality gate once the project is created (needs SONAR_TOKEN).
      # - name: Static analysis
      #   run: mvn -B sonar:sonar -Dsonar.projectKey=microservices-happens_${{ matrix.service }}
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
