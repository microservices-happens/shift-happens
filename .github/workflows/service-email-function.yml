# Isolated pipeline for the serverless email function (owner slot E).
#
# It is not a microservice, but it is still an independently deployable slice, so it gets its own
# pipeline. `run-integration-tests: false` shows how an input can switch a stage off: the function
# has no Testcontainers tests yet, and the stage will be enabled by P4.4.
name: service-email-function

on:
  push:
    branches-ignore: [main]
    paths:
      - 'functions/email-function/**'
      - 'contracts/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/service-email-function.yml'
  workflow_dispatch:

concurrency:
  group: service-email-function-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: email-function
      directory: functions/email-function
      run-integration-tests: false
