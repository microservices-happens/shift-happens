# Isolated pipeline for audit-service (owner slot E, see docs/implementation-plan.md §8).
#
# Runs on every push to a feature branch that touches this service or the contracts, and on demand
# from the Actions tab ("Run workflow") or the API. Re-running this run touches only
# audit-service. Pull requests are gated by the aggregate `services` workflow.
#
# The shared pipeline lives in _service-ci.yml; this file only declares when it runs.
name: service-audit

on:
  push:
    branches-ignore: [main]
    paths:
      - 'services/audit-service/**'
      - 'contracts/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/service-audit.yml'
  workflow_dispatch:

concurrency:
  group: service-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: audit-service
      directory: services/audit-service
