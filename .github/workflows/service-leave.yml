# Isolated pipeline for leave-service (owner slot D, see docs/implementation-plan.md §8).
#
# Runs on every push to a feature branch that touches this service or the contracts, and on demand
# from the Actions tab ("Run workflow") or the API. Re-running this run touches only
# leave-service. Pull requests are gated by the aggregate `services` workflow.
#
# The shared pipeline lives in _service-ci.yml; this file only declares when it runs.
name: service-leave

on:
  push:
    branches-ignore: [main]
    paths:
      - 'services/leave-service/**'
      - 'contracts/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/service-leave.yml'
  workflow_dispatch:

concurrency:
  group: service-leave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: leave-service
      directory: services/leave-service
