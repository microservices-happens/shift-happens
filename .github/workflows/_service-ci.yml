# Reusable pipeline for ONE microservice (a "slice").
#
# Why a reusable workflow: every service gets the same build + unit-test pipeline, but as its own
# run. A group member can therefore re-run only their own service (Actions tab -> the run ->
# "Re-run jobs"), and a failure in one service never hides another.
#
# Build + unit tests are enough at this level because a service does not need any other service to
# compile or to test its domain rules. Cross-service cooperation is tested by the aggregate
# `system-tests` workflow.
#
# Data sharing demonstrated here:
#   * an explicit Maven repository cache scoped to this service's pom,
#   * the packaged jar uploaded as an artifact and downloaded by the integration-test job,
#   * all test reports collected by a final summary job.
name: _service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Service folder name, e.g. identity-service
        required: true
        type: string
      directory:
        description: Path to the Maven project, e.g. services/identity-service
        required: true
        type: string
      java-version:
        description: JDK used for build and tests
        required: false
        type: string
        default: '21'
      run-integration-tests:
        description: Also run *IT tests (Testcontainers, needs Docker)
        required: false
        type: boolean
        default: true

jobs:
  build-and-unit-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # One cache per OS + JDK, shared by every service: the dependencies are the same, so this
      # avoids each of the eight pipelines downloading Spring Boot from Maven Central again (which is
      # also what triggered the transient 403 we saw on windows-latest). Bump the -v1 suffix to
      # invalidate every cache on purpose.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-jdk${{ inputs.java-version }}-v1
          restore-keys: |
            m2-${{ runner.os }}-jdk${{ inputs.java-version }}-

      # `package` runs the unit tests (Surefire) and produces the jar. Failsafe is bound to the
      # later integration-test phase, so no containers are started here.
      - name: Build and unit tests
        uses: ./.github/actions/maven-build
        with:
          directory: ${{ inputs.directory }}
          goals: package

      - name: Share the jar with the next job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-jar
          path: ${{ inputs.directory }}/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Share the unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-unit-reports
          path: ${{ inputs.directory }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    name: integration tests
    needs: build-and-unit-test
    if: ${{ inputs.run-integration-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-jdk${{ inputs.java-version }}-v1
          restore-keys: |
            m2-${{ runner.os }}-jdk${{ inputs.java-version }}-

      # Data sharing between jobs: the jar built above arrives here as an artifact.
      - name: Download the jar from the build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service }}-jar
          path: build-output
      - name: Show what arrived
        run: ls -l build-output

      # Failsafe runs *IT (Testcontainers). -Dskip.unit.tests=true is wired to Surefire in the pom
      # so the unit tests are not repeated (quote it in PowerShell).
      - name: Integration tests
        uses: ./.github/actions/maven-build
        with:
          directory: ${{ inputs.directory }}
          goals: verify -Dskip.unit.tests=true

      - name: Share the integration-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-integration-reports
          path: ${{ inputs.directory }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: summary
    needs: [build-and-unit-test, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download every report produced by this run
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.service }}-*-reports
          merge-multiple: true
          path: reports
      - name: Write the run summary
        run: |
          {
            echo "### ${{ inputs.service }}"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| build + unit tests | ${{ needs.build-and-unit-test.result }} |"
            echo "| integration tests | ${{ needs.integration-tests.result }} |"
            echo
            echo "Reports collected from the other jobs:"
            echo '```'
            find reports -type f | sort | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
