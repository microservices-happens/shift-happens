# Isolated pipeline for scheduling-service (owner slot C, see docs/implementation-plan.md §8).
#
# Runs on every push to a feature branch that touches this service or the contracts, and on demand
# from the Actions tab ("Run workflow") or the API. Re-running this run touches only
# scheduling-service. Pull requests are gated by the aggregate `services` workflow.
#
# The shared pipeline lives in _service-ci.yml; this file only declares when it runs.
name: service-scheduling

on:
  push:
    branches-ignore: [main]
    paths:
      - 'services/scheduling-service/**'
      - 'contracts/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/service-scheduling.yml'
  workflow_dispatch:

concurrency:
  group: service-scheduling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: scheduling-service
      directory: services/scheduling-service
