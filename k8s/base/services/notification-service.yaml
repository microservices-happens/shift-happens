# In-app notifications; requests emails from email-function
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: shift-happens }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: shift-happens }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/microservices-happens/notification-service:0.1.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: shift-happens-config }
            - secretRef: { name: notification-service-secrets, optional: true }
          env:
            - name: SPRING_APPLICATION_NAME
              value: notification-service
          readinessProbe: { httpGet: { path: /health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/liveness, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app.kubernetes.io/name: notification-service }
  ports: [{ port: 8080, targetPort: 8080 }]
