# Non-secret settings shared by all services (same names as docker-compose.microservices.yml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shift-happens-config
data:
  HTTP_PORT: "8080"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: shift-happens
  EVENT_EXCHANGE: shift-happens.events
  DEAD_LETTER_EXCHANGE: shift-happens.dlx
  JWT_ISSUER: shift-happens-identity
  JWT_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
