# Read side scales on CPU. Queue consumers can instead use KEDA ScaledObjects on queue length.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scheduling-query
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: scheduling-query }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
